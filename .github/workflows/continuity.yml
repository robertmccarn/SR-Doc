name: Narrative continuity

on:
  pull_request:
  push:
    branches: [main, master, audit/continuity-research]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Test source-aware infobox extraction and comparison
        run: python -m unittest discover -s research/rag -p "test_infobox_claims.py" -v
      - name: Test evidence packet schema status contract
        run: python -m unittest discover -s research/rag -p "test_evidence_packet_schema.py" -v
      - run: python -m sr_doc.validate
      - run: python -m compileall -q sr_doc
      - run: pytest
